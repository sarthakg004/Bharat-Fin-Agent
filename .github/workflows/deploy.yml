name: Deploy

# On every push to main: run the tests, then deploy the backend to Cloud Run and
# the frontend to Firebase Hosting. Auth to Google Cloud is keyless (Workload
# Identity Federation), so no service-account key is stored in GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: fin-agent-498211
  REGION: asia-south1
  SERVICE: finagent
  # The collection, its embedder and the reranker are pinned here and forced
  # onto the service on every deploy. A collection can only be searched with
  # the embedder it was built with, so these two must change together.
  US_COLLECTION: us_filings_v5_gemini
  EMBEDDING_MODEL: gemini-embedding-2
  RERANKER_MODEL: cohere:rerank-v4.0-pro
  BACKEND_URL: https://finagent-237355589454.asia-south1.run.app

permissions:
  contents: read
  id-token: write              # required for Workload Identity Federation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest
          python -m spacy download en_core_web_sm

      - name: Run tests
        env:
          # The tests never call a provider; the keys only have to be present.
          GROQ_API_KEY: ci-dummy-key
          GEMINI_API_KEY: ci-dummy-key
        run: pytest tests/ -q

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Typecheck frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit

  deploy:
    runs-on: ubuntu-latest
    needs: test
    # Kept on this job, not the workflow: tests must not see the live cluster URL.
    # Re-asserted on every deploy so a manual `gcloud run services update` cannot
    # leave them missing.
    env:
      QDRANT_URL: https://9eeb62bc-b2f8-479f-87b1-255415dac7ca.eu-west-2-0.aws.cloud.qdrant.io
      ALLOWED_ORIGINS: https://fin-agent-498211.web.app,https://fin-agent-498211.firebaseapp.com
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/237355589454/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@fin-agent-498211.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # `--source .` builds the Dockerfile with Cloud Build.
      # --max-instances 1 caps the bill; the service still scales to zero.
      # --cpu 8 / 8Gi: sized for the local fallback reranker, which is slow on
      #   few cores (1.4 s per passage on 2 vCPU). Cohere is the normal path.
      # --update-env-vars only changes the named keys; secrets stay attached.
      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --source . \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --memory 8Gi \
            --cpu 8 \
            --cpu-boost \
            --max-instances 1 \
            --timeout 3600 \
            --update-env-vars "^@^US_COLLECTION=${US_COLLECTION}@EMBEDDING_MODEL=${EMBEDDING_MODEL}@RERANKER_MODEL=${RERANKER_MODEL}@QDRANT_URL=${QDRANT_URL}@ALLOWED_ORIGINS=${ALLOWED_ORIGINS}" \
            --quiet

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.BACKEND_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy frontend to Firebase Hosting
        run: |
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project "${PROJECT_ID}" \
            --non-interactive
