name: Deploy

# CI/CD: on every push to main, deploy the backend to Cloud Run and the
# frontend to Firebase Hosting. Authentication is keyless (Workload Identity
# Federation) — no service-account JSON is ever stored in GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch: {}        # lets you trigger a deploy by hand from the Actions tab

# Never run two deploys at once; cancel an in-flight one if a newer push lands.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: fin-agent-498211
  REGION: asia-south1
  SERVICE: finagent
  # Served Qdrant collection. Must match the embedder/geometry in the code
  # of the same commit -- see results/RETRIEVAL_EXPERIMENTS.md §7.
  US_COLLECTION: us_filings_v2
  DATA_BUCKET: gs://fin-agent-498211-data
  # Public Cloud Run URL — baked into the frontend bundle so the SPA calls the API.
  BACKEND_URL: https://finagent-237355589454.asia-south1.run.app

permissions:
  contents: read
  id-token: write              # REQUIRED for Workload Identity Federation

jobs:
  # Gate: nothing deploys unless the test suite and the frontend typecheck pass.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # pypdf: test-only (test_upload_guards builds fixture PDFs with it).
          pip install -r requirements.txt pytest pypdf

      - name: Run tests
        env:
          # The smoke tests build the agent (which requires a key to be
          # PRESENT) but never call the network — a dummy satisfies them.
          GROQ_API_KEY: ci-dummy-key
        run: pytest tests/ -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Typecheck frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keyless auth to GCP. The provider + SA are not secrets — access is
      # gated by the repo binding we created with gcloud.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/237355589454/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@fin-agent-498211.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Backend → Cloud Run. `--source .` builds the Dockerfile via Cloud Build.
      # --update-env-vars only ADDS/overrides the named key, so the API keys and
      # ALLOWED_ORIGINS already configured on the service are preserved.
      #
      # US_COLLECTION rides the deploy so the served collection and the code that
      # matches it land in ONE revision. They cannot be changed separately: the
      # embedder's dimensionality is baked into the collection, so old code with
      # a new collection (or the reverse) fails every query. Cloud Run switches
      # revisions atomically, so there is no window where they disagree.
      # Rollback = revert the code commit; this env var follows it.
      - name: Deploy backend to Cloud Run
        run: |
          # --max-instances 1: uploaded documents live in one instance's memory
          # (see /api/upload); a second instance would randomly miss them. Also
          # caps the worst-case bill. Scale-to-zero still applies.
          gcloud run deploy "${SERVICE}" \
            --source . \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --memory 8Gi \
            --cpu 2 \
            --cpu-boost \
            --max-instances 1 \
            --timeout 3600 \
            --update-env-vars "US_COLLECTION=${US_COLLECTION}" \
            --quiet

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Frontend → build with the Cloud Run URL baked in, then deploy to Firebase.
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.BACKEND_URL }}
        run: |
          npm ci
          npm run build

      # firebase-tools picks up the credentials from the auth step above
      # (GOOGLE_APPLICATION_CREDENTIALS), so no FIREBASE_TOKEN is needed.
      - name: Deploy frontend to Firebase Hosting
        run: |
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project "${PROJECT_ID}" \
            --non-interactive
