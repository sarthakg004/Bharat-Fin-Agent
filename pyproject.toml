[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finagent"
version = "3.0.0"
description = "A LangGraph agent that answers questions about SEC filings with cited, fact-checked answers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Saarthak Gupta" }]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.optional-dependencies]
# Offline evaluation.
eval = ["ragas>=0.2.0", "langchain-huggingface>=0.1.0"]
dev = ["finagent[eval]", "pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["finagent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
